[project]
name = "kablocast-backend"
version = "0.1.0"
description = "KabloCast — Zero-Quota iPhone USB QuickTime & AirPlay 2 Mirroring Backend for Windows 11"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.8.0",
    "pyusb>=1.3.1",
    "libusb>=1.0.27",
    "av>=14.0.0",
    "qrcode>=8.0",
    "pillow>=11.0.0",
    "psutil>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
